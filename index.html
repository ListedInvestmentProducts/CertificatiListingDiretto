<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;

.card{background:#fff;width:100%;max-width:380px;border-radius:14px;padding:28px 26px;

.ric{display:flex;align-items:center;gap:8px;margin:12px 0 18px;font-size:13px;color:#6B778C}
.btns{display:flex;gap:10px}
button{flex:1;padding:11px 10px;font-size:15px;border-radius:9px;cursor:pointer;border:1px solid #1E3761}
.pri{background:#1E3761;color:#fff}
.sec{background:#fff;color:#1E3761}

const CHIAVE_LS = "certld_" + P.sale.slice(0, 12);
const b2a = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const a2b = u => btoa(String.fromCharCode(...new Uint8Array(u)));
const ls = {
  get(){ try { return localStorage.getItem(CHIAVE_LS); } catch(e){ return null; } },
  set(v){ try { localStorage.setItem(CHIAVE_LS, v); } catch(e){} },
  del(){ try { localStorage.removeItem(CHIAVE_LS); } catch(e){} }
};

async function chiaveDa(pw){
  const base = await crypto.subtle.importKey("raw",
    new TextEncoder().encode(pw.normalize("NFC")), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b2a(P.sale), iterations:P.iterazioni, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, true, ["decrypt"]);
}
async function decripta(chiave){
  const chiaro = await crypto.subtle.decrypt({name:"AES-GCM", iv:b2a(P.iv)}, chiave, b2a(P.dati));
  return new TextDecoder().decode(chiaro);
}
function mostra(pagina){
  const extra = '<div id="__ld_bar" style="position:fixed;right:12px;bottom:12px;z-index:99999;'
    + 'font:12px Segoe UI,system-ui,sans-serif">'
    + '<a href="#" id="__ld_out" style="background:#fff;color:#1E3761;padding:7px 11px;border-radius:8px;'
    + 'text-decoration:none;border:1px solid #1E3761">Esci</a></div>'
    + '<script>document.getElementById("__ld_out").onclick=function(e){e.preventDefault();'
    + 'try{localStorage.removeItem(' + JSON.stringify(CHIAVE_LS) + ');}catch(x){}location.reload();};<\/script>';
  const i = pagina.lastIndexOf("</body>");
  const conBarra = i >= 0 ? pagina.slice(0, i) + extra + pagina.slice(i) : pagina + extra;
  // sostituisce TUTTA la pagina (head e body), senza document.open/write:
  // cosi' non puo' restare nulla della pagina della password
  const nuovo = new DOMParser().parseFromString(conBarra, "text/html");
  document.replaceChild(document.adoptNode(nuovo.documentElement), document.documentElement);
  // gli script arrivati cosi' non partono da soli: si ricreano, nell'ordine
  document.querySelectorAll("script").forEach(vecchio => {
    const s = document.createElement("script");
    for (const a of vecchio.attributes) s.setAttribute(a.name, a.value);
    s.textContent = vecchio.textContent;
    vecchio.replaceWith(s);
  });
  window.scrollTo(0, 0);
}
async function conPassword(){
  const err = document.getElementById("err");
  const pw = document.getElementById("pw").value;
  if (!pw) { err.textContent = "Inserisci la password."; return; }
  if (!window.crypto || !crypto.subtle) { err.textContent = "Browser non supportato: usa Chrome, Edge, Safari o Firefox aggiornati."; return; }
  document.querySelectorAll("button").forEach(b => b.disabled = true);
  err.textContent = "";
  try {
    const chiave = await chiaveDa(pw);
    const pagina = await decripta(chiave);
    if (document.getElementById("ric").checked) ls.set(a2b(await crypto.subtle.exportKey("raw", chiave)));
    setTimeout(() => mostra(pagina), 0);
  } catch(e) {
    err.textContent = "Password errata.";
  } finally {
    document.querySelectorAll("button").forEach(b => b.disabled = false);
  }
}
document.getElementById("f").addEventListener("submit", e => { e.preventDefault(); conPassword(); });
// "Ricordami": si apre da sola, ma solo a pagina caricata del tutto
// (altrimenti document.open non sostituisce la pagina e le due si mescolano)
const salvata = (window.crypto && crypto.subtle) ? ls.get() : null;
if (salvata) {
  document.querySelector(".card").style.visibility = "hidden";
  const avvia = async () => {
    try {
      const chiave = await crypto.subtle.importKey("raw", b2a(salvata), {name:"AES-GCM"}, true, ["decrypt"]);
      const pagina = await decripta(chiave);
      setTimeout(() => mostra(pagina), 0);
    } catch(e) {              // password cambiata: si richiede
      ls.del();
      document.querySelector(".card").style.visibility = "";
    }
  };
  if (document.readyState === "complete") setTimeout(avvia, 0);
  else window.addEventListener("load", () => setTimeout(avvia, 0));
}
})();
</script>
